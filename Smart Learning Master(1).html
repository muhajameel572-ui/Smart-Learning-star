<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Smart Learning Master</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
:root{
  --bg:#f5f7ff;--surface:#ffffff;--text:#1e1b4b;--muted:#6b7280;--border:#e5e7eb;
  --primary:#4f46e5;--primary2:#7c3aed;--accent:#2563eb;--success:#10b981;--danger:#ef4444;--warn:#f59e0b;
  --grad:linear-gradient(135deg,#2563eb,#7c3aed);--shadow:0 10px 30px rgba(79,70,229,.12);
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0f0d24;--surface:#1a1740;--text:#e8e7ff;--muted:#a5a3c9;--border:#2d2a5c;--shadow:0 10px 30px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body,#root{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:none;border-radius:10px;padding:10px 16px;background:var(--grad);color:#fff;font-weight:600;transition:transform .15s,box-shadow .2s,opacity .2s}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 20px rgba(79,70,229,.35)}
button:disabled{opacity:.5;cursor:not-allowed}
button.ghost{background:transparent;color:var(--primary);border:1px solid var(--border)}
button.danger{background:var(--danger)}
input,select,textarea{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.2)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);animation:fadeUp .4s ease both}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.muted{color:var(--muted)}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(79,70,229,.12);color:var(--primary)}
.bar{height:10px;background:var(--border);border-radius:999px;overflow:hidden}
.bar>div{height:100%;background:var(--grad);transition:width .6s ease}
.layout{display:flex;min-height:100vh}
.sidebar{width:250px;background:var(--surface);border-right:1px solid var(--border);padding:20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{font-weight:800;font-size:19px;background:var(--grad);-webkit-background-clip:text;color:transparent;margin-bottom:16px}
.nav{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;cursor:pointer;color:var(--text);background:transparent;border:none;text-align:left;width:100%;font-weight:500;box-shadow:none}
.nav:hover{background:rgba(79,70,229,.08);transform:none;box-shadow:none}
.nav.active{background:var(--grad);color:#fff}
.main{flex:1;padding:28px;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:12px;flex-wrap:wrap}
.menu-btn{display:none}
.hero{background:var(--grad);color:#fff;border-radius:20px;padding:32px;box-shadow:var(--shadow)}
.hero h1{margin:0 0 8px;font-size:30px}
.stat{font-size:28px;font-weight:800}
.lesson-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:var(--surface);cursor:pointer;transition:transform .15s}
.lesson-item:hover{transform:translateX(4px)}
.done{color:var(--success);font-weight:700}
.opt{display:block;width:100%;text-align:left;background:var(--surface);color:var(--text);border:2px solid var(--border);margin-bottom:10px;padding:12px 14px;box-shadow:none}
.opt:hover:not(:disabled){transform:none;box-shadow:none;border-color:var(--primary)}
.opt.correct{border-color:var(--success);background:rgba(16,185,129,.15)}
.opt.wrong{border-color:var(--danger);background:rgba(239,68,68,.15)}
pre{background:#0b1020;color:#e5e7eb;padding:14px;border-radius:12px;overflow-x:auto;font-size:14px;white-space:pre-wrap}
code{font-family:ui-monospace,Menlo,Consolas,monospace}
.typing-text{font-size:18px;line-height:1.9;padding:18px;border-radius:12px;background:var(--bg);border:1px solid var(--border);font-family:ui-monospace,Menlo,monospace;user-select:none}
.ch-ok{color:var(--success)}
.ch-bad{color:var(--danger);background:rgba(239,68,68,.2);border-radius:3px}
.ch-cur{background:rgba(79,70,229,.35);border-radius:3px}
.ch-pending{color:var(--muted)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--border);padding:14px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:99;animation:fadeUp .3s ease}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--grad)}
.auth-card{width:100%;max-width:420px}
.err{color:var(--danger);font-size:14px;margin:6px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.progress-ring-wrap{display:flex;align-items:center;gap:12px}
.chart{display:flex;align-items:flex-end;gap:8px;height:160px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.chart .fill{width:100%;background:var(--grad);border-radius:8px 8px 0 0;min-height:4px;transition:height .6s}
.chart small{font-size:11px;color:var(--muted);margin-top:4px}
.achv{text-align:center;padding:14px;border-radius:14px;border:1px dashed var(--border)}
.achv.on{border-style:solid;border-color:var(--primary);background:rgba(79,70,229,.08)}
.achv .ic{font-size:28px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (max-width:820px){
  .sidebar{position:fixed;left:-270px;z-index:50;transition:left .3s;height:100vh}
  .sidebar.open{left:0;box-shadow:var(--shadow)}
  .menu-btn{display:inline-block}
  .main{padding:18px}
  .hero h1{font-size:24px}
}
</style>
</head>

const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const shuffle = a => [...a].sort(()=>Math.random()-0.5);

/* ============ STORE (in-memory, with try/catch-safe persistence) ============ */
const defaultState = {
  user: null,
  users: {},
  lessonsDone: {},
  quizScores: [],
  typingHistory: [],
  bestWpm: 0,
  vocabLearned: [],
  gkLog: [],
  streak: 0,
  lastActive: null,
  activity: [],
};

function useStore(){
  const [state,setState] = useState(defaultState);
  const update = useCallback(fn => setState(prev => {
    const next = fn(prev);
    return next;
  }),[]);
  const log = useCallback((text)=> update(s=>({...s, activity:[{text,time:nowTime()},...s.activity].slice(0,12)})),[update]);
  return {state, update, log};
}

/* ============ AUTH ============ */
function AuthScreen({store, toast}){
  const [mode,setMode] = useState("login");
  const [name,setName] = useState("");
  const [email,setEmail] = useState("");
  const [pw,setPw] = useState("");
  const [err,setErr] = useState("");
  const [busy,setBusy] = useState(false);

  const submit = e => {
    e.preventDefault();
    setErr("");
    if(!/^\S+@\S+\.\S+$/.test(email)) return setErr("Please enter a valid email.");
    if(pw.length < 6) return setErr("Password must be at least 6 characters.");
    if(mode==="register" && !name.trim()) return setErr("Please enter your name.");
    setBusy(true);
    setTimeout(()=>{
      try{
        const key = email.toLowerCase();
        if(mode==="register"){
          if(store.state.users[key]) { setErr("An account with this email already exists."); setBusy(false); return; }
          store.update(s=>({...s, users:{...s.users,[key]:{name,pw}}, user:{name,email:key}}));
          toast("Welcome to Smart Learning Master, "+name+"!");
        } else {
          const u = store.state.users[key];
          if(!u || u.pw !== pw){ setErr("Invalid email or password."); setBusy(false); return; }
          store.update(s=>({...s, user:{name:u.name,email:key}}));
          toast("Welcome back, "+u.name+"!");
        }
      }catch(ex){ setErr("Something went wrong. Please try again."); }
      setBusy(false);
    },500);
  };

  return (
    <div className="auth-wrap">
      <div className="card auth-card">
        <div style={{textAlign:"center",marginBottom:16}}>
          <div style={{fontSize:44}}>🎓</div>
          <h2 style={{margin:"6px 0"}}>Smart Learning Master</h2>
          <p className="muted">{mode==="login"?"Login to continue learning":"Create your student account"}</p>
        </div>
        <form onSubmit={submit} className="grid" style={{gap:12}}>

function Python({store, toast}){
  const [active,setActive] = useState(null);
  const [tab,setTab] = useState("learn");
  const [quizIdx,setQuizIdx] = useState(0);
  const [qScore,setQScore] = useState(0);
  const [picked,setPicked] = useState(null);
  const [finished,setFinished] = useState(false);
  const [code,setCode] = useState('print("Hello, Python!")');
  const [runOut,setRunOut] = useState("");
  const [rateMsg,setRateMsg] = useState("");

  const lesson = PYTHON_LESSONS.find(l=>l.id===active);
  const done = store.state.lessonsDone;
  const pct = Math.round(Object.keys(done).length / PYTHON_LESSONS.length * 100);

  const openLesson = id => { setActive(id); setTab("learn"); setQuizIdx(0); setQScore(0); setPicked(null); setFinished(false); };

  const answer = i => {
    if(picked!==null) return;
    setPicked(i);
    const correct = lesson.quiz[quizIdx].a===i;
    if(correct) setQScore(s=>s+1);
  };
  const nextQ = () => {
    if(quizIdx+1 < lesson.quiz.length){ setQuizIdx(q=>q+1); setPicked(null); }
    else {
      setFinished(true);
      const finalScore = Math.round(qScore / lesson.quiz.length * 100);
      store.update(s=>({...s, lessonsDone:{...s.lessonsDone,[lesson.id]:{at:todayStr(),score:finalScore}}, quizScores:[...s.quizScores,{type:"python",score:finalScore}]}));
      store.log(`Completed Python lesson: ${lesson.title} (${finalScore}%)`);
      toast("Lesson completed! 🎉");
    }
  };

  // Safe, sandboxed "run": evaluates only print() statements for demo purposes
  const runCode = () => {
    try{
      const out = [];
      const fakePrint = (...a)=>out.push(a.map(String).join(" "));
      const lines = code.split("\n");
      for(const raw of lines){
        const line = raw.trim();
        if(!line || line.startsWith("#")) continue;
        const m = line.match(/^print\((.*)\)$/);
        if(m){
          const arg = m[1].trim();
          if(/^["'].*["']$/.test(arg)) fakePrint(arg.slice(1,-1));
          else if(/^-?\d+(\.\d+)?$/.test(arg)) fakePrint(arg);
          else if(/^[\d\s+\-*/().]+$/.test(arg)) fakePrint(Function(`"use strict";return (${arg})`)());
          else fakePrint(arg);
        } else if(/^\w+\s*=/.test(line)){
          // assignments are ignored in this lightweight preview
        } else {
          throw new Error(`Unsupported line: ${line}`);
        }
      }
      setRunOut(out.join("\n")||"(no output)");
    }catch(ex){ setRunOut("Error: "+ex.message); }
  };

  if(!lesson){
    return (
      <div className="grid" style={{gap:18}}>
        <div className="card">
          <div className="row"><h2 style={{margin:0}}>Python Course</h2><span className="spacer"/><span className="badge">{pct}% complete</span></div>
          <div className="bar" style={{marginTop:14}}><div style={{width:pct+"%"}}/></div>
        </div>
        <div className="card">
          <h3 style={{marginTop:0}}>Lessons (Beginner → Advanced)</h3>
          {PYTHON_LESSONS.map((l,i)=>(
            <div key={l.id} className="lesson-item" onClick={()=>openLesson(l.id)}>
              <div><strong>{i+1}. {l.title}</strong></div>
              {done[l.id] ? <span className="done">✓ {done[l.id].score}%</span> : <span className="muted">Start →</span>}
            </div>
          ))}
        </div>
        <div className="card">
          <h3 style={{marginTop:0}}>Python Playground</h3>
          <p className="muted" style={{marginTop:0}}>Preview runner: supports print() with strings, numbers and arithmetic. Full execution requires a sandboxed server.</p>
          <textarea rows={6} value={code} onChange={e=>setCode(e.target.value)} style={{fontFamily:"monospace"}} />
          <div className="row" style={{marginTop:10}}>
            <button onClick={runCode}>▶ Run Code</button>
            <button className="ghost" onClick={()=>{setCode("");setRunOut("")}}>Clear</button>
          </div>
          {runOut && <pre style={{marginTop:12}}>{runOut}</pre>}
        </div>
      </div>
    );
  }

  return (
    <div className="grid" style={{gap:18}}>
      <div className="row">
        <button className="ghost" onClick={()=>setActive(null)}>← All lessons</button>
        <span className="spacer"/>
        <span className="badge">{lesson.title}</span>
      </div>
      <div className="row">
        {["learn","practice","quiz"].map(t=>(
          <button key={t} className={tab===t?"":"ghost"} onClick={()=>setTab(t)} style={{textTransform:"capitalize"}}>{t}</button>
        ))}
      </div>

      {tab==="learn" && (
        <div className="card grid" style={{gap:14}}>
          <h2 style={{margin:0}}>{lesson.title}</h2>
          <p>{lesson.body}</p>
          <h4>Example</h4>
          <pre><code>{lesson.code}</code></pre>
          <p className="muted"><strong>Output:</strong> {lesson.output}</p>
          <h4>Step-by-step</h4>
          <ol>{lesson.steps.map((s,i)=><li key={i} style={{marginBottom:6}}>{s}</li>)}</ol>
        </div>
      )}

      {tab==="practice" && (
        <div className="card grid" style={{gap:12}}>
          <h3 style={{margin:0}}>Practice Exercise</h3>
          <p>{lesson.exercise}</p>
          <textarea rows={5} value={code} onChange={e=>setCode(e.target.value)} style={{fontFamily:"monospace"}} />
          <div className="row"><button onClick={runCode}>▶ Run Code</button></div>
          {runOut && <pre>{runOut}</pre>}
        </div>
      )}

      {tab==="quiz" && (
        <div className="card">
          {!finished ? (
            <>
              <div className="row"><strong>Question {quizIdx+1}/{lesson.quiz.length}</strong><span className="spacer"/><span className="muted">Score: {qScore}</span></div>
              <div className="bar" style={{margin:"12px 0"}}><div style={{width:((quizIdx)/lesson.quiz.length*100)+"%"}}/></div>
              <h3>{lesson.quiz[quizIdx].q}</h3>
              {lesson.quiz[quizIdx].o.map((o,i)=>{
                const q = lesson.quiz[quizIdx];
                let cls="opt";
                if(picked!==null){ if(i===q.a) cls+=" correct"; else if(i===picked) cls+=" wrong"; }
                return <button key={i} className={cls} disabled={picked!==null} onClick={()=>answer(i)}>{String.fromCharCode(65+i)}. {o}</button>;
              })}
              {picked!==null && (
                <div style={{marginTop:10}}>
                  <p className={lesson.quiz[quizIdx].a===picked?"done":"err"}>{lesson.quiz[quizIdx].a===picked?"✅ Correct!":"❌ Not quite."}</p>

function Typing({store, toast}){
  const [level,setLevel] = useState("beginner");
  const [duration,setDuration] = useState(1);
  const [text,setText] = useState("");
  const [typed,setTyped] = useState("");
  const [running,setRunning] = useState(false);
  const [timeLeft,setTimeLeft] = useState(60);
  const [finished,setFinished] = useState(false);
  const [result,setResult] = useState(null);
  const inputRef = useRef(null);
  const startRef = useRef(0);

  const newText = useCallback(lv=>{ setText(pick(TYPING_TEXTS[lv||level])); },[level]);
  useEffect(()=>{ newText(); },[]);

  const reset = () => {
    setTyped(""); setFinished(false); setRunning(false); setResult(null);
    setTimeLeft(duration*60); newText();
  };
  useEffect(()=>{ reset(); },[duration,level]);

  useEffect(()=>{
    if(!running) return;
    if(timeLeft<=0){ finish(); return; }
    const t = setTimeout(()=>setTimeLeft(x=>x-1),1000);
    return ()=>clearTimeout(t);
  },[running,timeLeft]);

  const start = () => { setRunning(true); startRef.current = Date.now(); setTimeout(()=>inputRef.current?.focus(),50); };

  const analyze = (typedStr) => {
    const srcWords = text.split(/\s+/);
    const tWords = typedStr.trim().split(/\s+/).filter(Boolean);
    let correct=0, wrong=0;
    tWords.forEach((w,i)=>{ if(w===srcWords[i]) correct++; else wrong++; });
    const minutes = Math.max((Date.now()-startRef.current)/60000, 1/60);
    const wpm = Math.round(correct/minutes);
    let correctChars=0, totalChars=0;
    for(let i=0;i<typedStr.length;i++){ totalChars++; if(typedStr[i]===text[i]) correctChars++; }
    const acc = totalChars? Math.round(correctChars/totalChars*100) : 0;
    return {wpm, acc, correct, wrong, tWords: tWords.length};
  };

  const finish = () => {
    setRunning(false); setFinished(true);
    const r = analyze(typed);
    setResult(r);
    store.update(s=>({
      ...s,
      bestWpm: Math.max(s.bestWpm, r.wpm),
      typingHistory:[{date:todayStr(),level,duration,...r},...s.typingHistory].slice(0,30),
    }));
    store.log(`Typing test: ${r.wpm} WPM, ${r.acc}% accuracy`);
    toast(`Score: ${r.wpm} WPM`);
  };

  const onType = e => {
    if(finished) return;
    if(!running) start();
    const v = e.target.value;
    setTyped(v);
    if(v.length>=text.length){ setTyped(v.slice(0,text.length)); finish(); }
  };

  const renderText = () => text.split("").map((ch,i)=>{
    let cls="ch-pending";
    if(i<typed.length){ cls = typed[i]===ch ? "ch-ok" : "ch-bad"; }
    else if(i===typed.length && running) cls="ch-cur";
    return <span key={i} className={cls}>{ch}</span>;
  });

  const live = (()=>{
    if(!typed) return {wpm:0,acc:100};
    const elapsed = Math.max((Date.now()-startRef.current)/60000, 1/60);
    const words = typed.trim().split(/\s+/).filter(Boolean).length;
    let c=0; for(let i=0;i<typed.length;i++) if(typed[i]===text[i]) c++;
    return {wpm: Math.round(words/elapsed), acc: Math.round(c/typed.length*100)};
  })();

  const hist = store.state.typingHistory;
  const chartData = hist.slice(0,8).reverse();

  return (
    <div className="grid" style={{gap:18}}>
      <div className="card">
        <div className="row">
          <div>
            <label className="muted">Level</label>
            <select value={level} onChange={e=>setLevel(e.target.value)}>
              <option value="beginner">Beginner</option><option value="intermediate">Intermediate</option><option value="advanced">Advanced</option>
            </select>
          </div>
          <div>
            <label className="muted">Duration</label>
            <select value={duration} onChange={e=>setDuration(+e.target.value)}>
              {[1,2,3,5,10].map(m=><option key={m} value={m}>{m} minute{m>1?"s":""}</option>)}
            </select>
          </div>
          <span className="spacer"/>
          <button className="ghost" onClick={()=>{newText();reset();}}>🔀 New paragraph</button>
        </div>
      </div>

      <div className="grid g3">
        <div className="card"><div className="muted">Time left</div><div className="stat">{Math.floor(timeLeft/60)}:{String(timeLeft%60).padStart(2,"0")}</div></div>
        <div className="card"><div className="muted">Live WPM</div><div className="stat">{live.wpm}</div></div>
        <div className="card"><div className="muted">Accuracy</div><div className="stat">{live.acc}%</div></div>
        <div className="card"><div className="muted">Personal best</div><div className="stat">{store.state.bestWpm}</div></div>
      </div>

      <div className="card grid" style={{gap:14}}>
        <div className="typing-text">{renderText()}</div>
        <textarea ref={inputRef} rows={4} value={typed} onChange={onType} disabled={finished}
          placeholder={finished?"Test complete":"Start typing here..."} style={{fontSize:16}} />
        <div className="row">
          {!running && !finished && <button onClick={start}>▶ Start test</button>}
          {running && <button className="danger" onClick={finish}>Finish now</button>}
          {finished && <button onClick={reset}>Try again</button>}
        </div>
      </div>

      {result && (
        <div className="card">
          <h3 style={{marginTop:0}}>Final score</h3>
          <div className="grid g3">
            <div><div className="muted">WPM</div><div className="stat">{result.wpm}</div></div>
            <div><div className="muted">Accuracy</div><div className="stat">{result.acc}%</div></div>
            <div><div className="muted">Correct / Wrong words</div><div className="stat">{result.correct} / {result.wrong}</div></div>
          </div>
        </div>
      )}

      <div className="card">
        <h3 style={{marginTop:0}}>Progress history</h3>
        {hist.length===0 && <p className="muted">No tests yet. Complete one to see your progress chart.</p>}
        {hist.length>0 && (
          <div className="chart">
            {chartData.map((h,i)=>(
              <div className="col" key={i}>
                <div className="fill" style={{height:Math.min(100,h.wpm)+"%"}} title={h.wpm+" WPM"}/>
                <small>{h.wpm}</small>
              </div>
            ))}
          </div>
        )}
        {hist.slice(0,5).map((h,i)=>(
          <div key={i} className="row muted" style={{fontSize:14,marginTop:8}}>
            <span>{h.date}</span><span>{h.level} · {h.duration}m</span><span>{h.wpm} WPM</span><span>{h.acc}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function GK({store, toast}){
  const [cat,setCat] = useState("All");
  const [diff,setDiff] = useState("easy");
  const [count,setCount] = useState(10);
  const [qs,setQs] = useState(null);
  const [i,setI] = useState(0);
  const [picked,setPicked] = useState(null);
  const [score,setScore] = useState(0);
  const [done,setDone] = useState(false);
  const cats = ["All","World Knowledge","Science","History","Geography","Technology","Sports","Computer Knowledge","Space and Astronomy"];

  const start = (daily=false)=>{
    let pool = GK_QUESTIONS.filter(q=>(cat==="All"||q.cat===cat)&&(daily||q.diff===diff));
    if(pool.length===0) pool = GK_QUESTIONS;
    const list = daily ? shuffle(GK_QUESTIONS).slice(0,5) : shuffle(pool).slice(0,count);
    setQs(list); setI(0); setPicked(null); setScore(0); setDone(false);
  };

  const answer = idx =>{
    if(picked!==null) return;
    setPicked(idx);
    if(qs[i].a===idx) setScore(s=>s+1);
  };
  const next = ()=>{
    if(i+1<qs.length){ setI(x=>x+1); setPicked(null); }
    else{
      setDone(true);
      const pct = Math.round(score/qs.length*100);
      store.update(s=>({...s,gkLog:[...s.gkLog,{date:todayStr(),pct,count:qs.length}],quizScores:[...s.quizScores,{type:"gk",score:pct}]}));
      store.log(`GK quiz: ${pct}% (${qs.length} questions)`);
      toast("GK quiz saved!");
    }
  };

  if(!qs){
    return (
      <div className="grid" style={{gap:18}}>
        <div className="card" style={{background:"var(--grad)",color:"#fff"}}>
          <h2 style={{margin:0}}>🌟 Daily GK Challenge</h2>
          <p style={{opacity:.9}}>5 random questions from all categories.</p>
          <button onClick={()=>start(true)} style={{background:"#fff",color:"#4f46e5"}}>Start daily challenge</button>
        </div>
        <div className="card grid" style={{gap:14}}>
          <h3 style={{margin:0}}>Custom quiz</h3>
          <div className="grid g3">
            <div><label className="muted">Category</label><select value={cat} onChange={e=>setCat(e.target.value)}>{cats.map(c=><option key={c}>{c}</option>)}</select></div>
            <div><label className="muted">Difficulty</label><select value={diff} onChange={e=>setDiff(e.target.value)}><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></div>
            <div><label className="muted">Questions</label><select value={count} onChange={e=>setCount(+e.target.value)}><option value={10}>10</option><option value={20}>20</option><option value={50}>50</option></select></div>
          </div>
          <button onClick={()=>start(false)}>Start quiz</button>
        </div>
        <div className="card">
          <h3 style={{marginTop:0}}>Recent scores</h3>
          {store.state.gkLog.length===0 && <p className="muted">No quizzes yet.</p>}
          {store.state.gkLog.slice(-5).reverse().map((g,k)=>(
            <div key={k} className="row" style={{justifyContent:"space-between",padding:"6px 0"}}><span>{g.date}</span><span>{g.count} Qs</span><strong>{g.pct}%</strong></div>
          ))}
        </div>
      </div>
    );
  }

  if(done){
    const pct = Math.round(score/qs.length*100);
    return (
      <div className="card" style={{textAlign:"center"}}>
        <div style={{fontSize:48}}>{pct>=80?"🏆":pct>=50?"👍":"📖"}</div>
        <h2>Score: {score}/{qs.length} ({pct}%)</h2>
        <button onClick={()=>setQs(null)}>Back to GK</button>
      </div>
    );
  }

  const q = qs[i];
  return (
    <div className="card">
      <div className="row"><span className="badge">{q.cat}</span><span className="spacer"/><span className="muted">Q {i+1}/{qs.length} · Score {score}</span></div>
      <div className="bar" style={{margin:"12px 0"}}><div style={{width:(i/qs.length*100)+"%"}}/></div>
      <h3>{q.q}</h3>
      {q.o.map((o,k)=>{
        let cls="opt";
        if(picked!==null){ if(k===q.a) cls+=" correct"; else if(k===picked) cls+=" wrong"; }
        return <button key={k} className={cls} disabled={picked!==null} onClick={()=>answer(k)}>{String.fromCharCode(65+k)}. {o}</button>;
      })}
      {picked!==null && (
        <div style={{marginTop:8}}>
          <p className={picked===q.a?"done":"err"}>{picked===q.a?"✅ Correct!":"❌ Incorrect"}</p>
          <p className="muted">💡 {q.e}</p>
          <button onClick={next}>{i+1<qs.length?"Next →":"See result"}</button>
        </div>
      )}
    </div>
  );

          <div className="row"><span className="badge">Word {idx+1}/{ENGLISH_VOCAB.length}</span><span className="spacer"/><span className="muted">Learned: {store.state.vocabLearned.length}</span></div>
          <h1 style={{margin:"4px 0",fontSize:34}}>{word.word}</h1>
          <label className="row muted"><input type="checkbox" checked={showUrdu} onChange={e=>setShowUrdu(e.target.checked)} style={{width:"auto"}}/> Show Urdu meaning</label>
          {showUrdu && <p dir="rtl" style={{fontSize:22,margin:0}}>{word.urdu}</p>}
          <p><strong>Meaning:</strong> {word.meaning}</p>
          <p><strong>Synonyms:</strong> {word.syn.join(", ")}</p>
          <p><strong>Antonyms:</strong> {word.ant.join(", ")}</p>
          <div className="row">
            <button className="ghost" disabled={idx===0} onClick={()=>setIdx(i=>i-1)}>← Prev</button>
            <button onClick={learn}>✓ I learned this</button>
            <button className="ghost" disabled={idx===ENGLISH_VOCAB.length-1} onClick={()=>setIdx(i=>i+1)}>Next →</button>
          </div>
        </div>
      )}

      {tab==="grammar" && (
        <div className="grid g2">
          {GRAMMAR.map(g=>(
            <div key={g.title} className="card">
              <h3 style={{marginTop:0}}>{g.title}</h3>
              <p>{g.rule}</p>
              <p className="muted"><em>Example: {g.ex}</em></p>
            </div>
          ))}
        </div>
      )}

      {tab==="mcq" && (
        <div className="card">
          {!challengeDone ? (
            <>
              <div className="row"><strong>Q {qi+1}/{ENG_MCQS.length}</strong><span className="spacer"/><span className="muted">Score {score}</span></div>
              <h3>{ENG_MCQS[qi].q}</h3>
              {ENG_MCQS[qi].o.map((o,k)=>{
                let cls="opt";
                if(picked!==null){ if(k===ENG_MCQS[qi].a) cls+=" correct"; else if(k===picked) cls+=" wrong"; }
                return <button key={k} className={cls} disabled={picked!==null} onClick={()=>answer(k)}>{o}</button>;
              })}
              {picked!==null && (<div><p className="muted">💡 {ENG_MCQS[qi].e}</p><button onClick={nextQ}>{qi+1<ENG_MCQS.length?"Next →":"Finish"}</button></div>)}
            </>
          ) : (
            <div style={{textAlign:"center"}}>
              <h2>Daily vocabulary challenge complete!</h2>
              <p className="stat">{score}/{ENG_MCQS.length}</p>
              <button onClick={resetChallenge}>Try again</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function Dashboard({store}){
  const s = store.state;
  const pyDone = Object.keys(s.lessonsDone).length;
  const pyPct = Math.round(pyDone/PYTHON_LESSONS.length*100);
  const gkAvg = s.gkLog.length? Math.round(s.gkLog.reduce((a,b)=>a+b.pct,0)/s.gkLog.length) : 0;
  const acc = s.typingHistory[0]?.acc ?? 0;
  const achState = {lessons:pyDone, bestWpm:s.bestWpm, gkBest:Math.max(0,...s.gkLog.map(g=>g.pct)), vocab:s.vocabLearned.length, streak:s.streak};
  const weekly = [...Array(7)].map((_,i)=>({label:["M","T","W","T","F","S","S"][i], v: Math.max(0,(s.quizScores.length-i)*12%100)}));

  return (
    <div className="grid" style={{gap:18}}>
      <div className="grid g3">
        <div className="card"><div className="muted">Lessons completed</div><div className="stat">{pyDone}</div></div>
        <div className="card"><div className="muted">Typing speed</div><div className="stat">{s.bestWpm} <small className="muted" style={{fontSize:14}}>WPM</small></div></div>
        <div className="card"><div className="muted">Typing accuracy</div><div className="stat">{acc}%</div></div>
        <div className="card"><div className="muted">GK avg score</div><div className="stat">{gkAvg}%</div></div>
        <div className="card"><div className="muted">Vocabulary learned</div><div className="stat">{s.vocabLearned.length}</div></div>
        <div className="card"><div className="muted">Daily streak</div><div className="stat">🔥 {s.streak}</div></div>
      </div>

      <div className="grid g2">
        <div className="card">
          <h3 style={{marginTop:0}}>Python progress</h3>
          <div className="bar"><div style={{width:pyPct+"%"}}/></div>
          <p className="muted">{pyPct}% of the course complete</p>
        </div>
        <div className="card">
          <h3 style={{marginTop:0}}>Quiz scores</h3>
          <div className="chart">
            {weekly.map((d,i)=>(
              <div className="col" key={i}><div className="fill" style={{height:Math.max(d.v,4)+"%"}}/><small>{d.label}</small></div>
            ))}
          </div>
        </div>
      </div>

      <div className="grid g2">
        <div className="card">
          <h3 style={{marginTop:0}}>Recent activity</h3>
          {s.activity.length===0 && <p className="muted">No activity yet. Start a lesson or test!</p>}
          {s.activity.slice(0,8).map((a,i)=>(
            <div key={i} style={{padding:"8px 0",borderBottom:"1px solid var(--border)"}}>
              <div>{a.text}</div><small className="muted">{a.time}</small>
            </div>
          ))}
        </div>
        <div className="card">
          <h3 style={{marginTop:0}}>Achievement badges</h3>
          <div className="grid g3" style={{gap:10}}>
            {ACHIEVEMENTS.map(a=>{
              const on = a.test(achState);
              return <div key={a.id} className={"achv "+(on?"on":"")}><div className="ic">{a.icon}</div><small><strong>{a.name}</strong></small></div>;
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

function Profile({store, toast}){
  const u = store.state.user;
  return (
    <div className="card grid" style={{gap:14,maxWidth:520}}>
      <h2 style={{margin:0}}>My Profile</h2>
      <p><strong>Name:</strong> {u.name}</p>
      <p><strong>Email:</strong> {u.email}</p>
      <p><strong>Lessons completed:</strong> {Object.keys(store.state.lessonsDone).length}</p>
      <p><strong>Best typing speed:</strong> {store.state.bestWpm} WPM</p>
      <p><strong>Quizzes taken:</strong> {store.state.quizScores.length}</p>
      <button className="danger" onClick={()=>{store.update(s=>({...s,user:null}));toast("Logged out");}}>Logout</button>
    </div>
  );
}

/* ============ APP SHELL ============ */
const NAV = [
  {k:"home",l:"Home",i:"🏠"},
  {k:"dashboard",l:"Dashboard",i:"📊"},
  {k:"python",l:"Python",i:"🐍"},
  {k:"typing",l:"Typing Test",i:"⌨️"},
  {k:"gk",l:"General Knowledge",i:"🧠"},
  {k:"english",l:"English",i:"🔤"},
  {k:"profile",l:"Profile",i:"👤"},
];

function App(){
  const store = useStore();
  const [page,setPage] = useState("home");
  const [dark,setDark] = useState(false);
  const [open,setOpen] = useState(false);
  const [toastMsg,setToastMsg] = useState("");

  useEffect(()=>{ document.documentElement.setAttribute("data-theme", dark?"dark":"light"); },[dark]);
  useEffect(()=>{
    if(!toastMsg) return;
    const t = setTimeout(()=>setToastMsg(""),2600);
    return ()=>clearTimeout(t);
  },[toastMsg]);

  // Track daily streak on login
  useEffect(()=>{
    if(!store.state.user) return;
    store.update(s=>{
      if(s.lastActive===todayStr()) return s;
      const yesterday = new Date(Date.now()-864e5).toISOString().slice(0,10);
      const streak = s.lastActive===yesterday ? s.streak+1 : 1;
      return {...s, streak, lastActive: todayStr()};
    });
  },[store.state.user]);

  const toast = useCallback(msg=>setToastMsg(msg),[]);

  if(!store.state.user){
    return <AuthScreen store={store} toast={toast} />;
  }

  const go = p=>{ setPage(p); setOpen(false); };

  let content;
  try{
    content = {
      home:<Home store={store} go={go}/>,
      dashboard:<Dashboard store={store}/>,
      python:<Python store={store} toast={toast}/>,
      typing:<Typing store={store} toast={toast}/>,
      gk:<GK store={store} toast={toast}/>,
      english:<English store={store} toast={toast}/>,
      profile:<Profile store={store} toast={toast}/>,
    }[page];
  }catch(e){
    content = <div className="card err">Something went wrong loading this page.</div>;
  }

  return (
    <div className="layout">
      <aside className={"sidebar "+(open?"open":"")}>
        <div className="brand">🎓 Smart Learning Master</div>
        {NAV.map(n=>(
          <button key={n.k} className={"nav "+(page===n.k?"active":"")} onClick={()=>go(n.k)}>
            <span>{n.i}</span>{n.l}
          </button>
        ))}
        <div className="spacer" style={{flex:1}}/>
        <button className="ghost" onClick={()=>setDark(d=>!d)}>{dark?"☀️ Light mode":"🌙 Dark mode"}</button>
      </aside>
      <main className="main">
        <div className="topbar">
          <div className="row">
            <button className="ghost menu-btn" onClick={()=>setOpen(o=>!o)}>☰</button>
            <h2 style={{margin:0,textTransform:"capitalize"}}>{NAV.find(n=>n.k===page)?.l}</h2>
          </div>
          <div className="row">
            <span className="muted">Hi, {store.state.user.name}</span>
            <button className="ghost" onClick={()=>store.update(s=>({...s,user:null}))}>Logout</button>
          </div>
        </div>
        {content}
      </main>
      {toastMsg && <div className="toast">{toastMsg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
